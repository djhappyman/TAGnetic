[package]
name = "tagrex-mcp"
description = "Local MCP adapter and stateless desktop connector for TAGnetic"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
tagrex-service = { path = "../service" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
sha2 = "0.10.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "client", "transport-io"] }
