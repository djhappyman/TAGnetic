[package]
name = "tagrex-audio-workbench"
description = "Streaming audio analysis and export for the TAGnetic workbench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ebur128 = "0.1.10"
encoding_rs = "0.8.35"
flacenc = { version = "=0.5.1", default-features = false }
rustfft = "6.4"
rusty_mp3 = "=1.2.2"
serde = { version = "1", features = ["derive"] }
symphonia = { version = "0.5.5", default-features = false, features = ["aiff", "flac", "mp3", "pcm", "wav"] }
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
