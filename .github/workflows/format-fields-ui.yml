name: Format fields UI
# Native release validation runs in CI. Run these frontend fixtures on demand.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: format-fields-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm ci --prefix tools/lint
      - run: npm run lint
      - run: npm run test:unit
      - run: npx playwright install --with-deps webkit
      - run: npx vite build --config tests/ui/vite.config.js
      - id: fixtures
        continue-on-error: true
        run: >-
          npx playwright test
          tests/ui/function-expression-chips.spec.js tests/ui/mask-builder-table.spec.js
          tests/ui/mask-presets-picker.spec.js tests/ui/rename-sidebar.spec.js
          tests/ui/pattern-input-chips.spec.js tests/ui/online-search-chips.spec.js
          tests/ui/online-scroll.spec.js tests/ui/field-format-chips.spec.js
          tests/ui/format-values-batch.spec.js tests/ui/command-ribbon.spec.js
          tests/ui/selection-edges.spec.js tests/ui/spreadsheet.spec.js
          tests/ui/table-scroll.spec.js tests/ui/table-sizing-scrollbar.spec.js
          tests/ui/table-scroll-performance.spec.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: format-fields-ui-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - name: Enforce fixture gate
        if: always() && steps.fixtures.outcome == 'failure'
        run: exit 1
