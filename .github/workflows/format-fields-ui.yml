name: Format fields UI
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/ui/**'
      - 'tests/ui/**'
      - 'tests/unit/**'
      - '.github/workflows/format-fields-ui.yml'
permissions:
  contents: read
concurrency:
  group: format-fields-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm ci --prefix tools/lint
      - run: npm run lint
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: format-fields-ui-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
