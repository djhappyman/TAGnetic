name: Format fields UI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/ui/**'
      - 'crates/core/src/search-fields.tsv'
      - 'tests/ui/**'
      - 'tests/unit/**'
      - '.github/workflows/format-fields-ui.yml'
      - 'playwright.config.js'
      - 'playwright.webkit.config.js'
  pull_request:
    paths:
      - 'app/ui/**'
      - 'crates/core/src/search-fields.tsv'
      - 'tests/ui/**'
      - 'tests/unit/**'
      - '.github/workflows/format-fields-ui.yml'
      - 'playwright.config.js'
      - 'playwright.webkit.config.js'
permissions:
  contents: read
concurrency:
  group: format-fields-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm ci --prefix tools/lint
      - run: npm run lint
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium webkit
      - run: npx vite build --config tests/ui/vite.config.js
      - id: chromium
        continue-on-error: true
        run: npx playwright test tests/ui/function-expression-chips.spec.js tests/ui/mask-builder-table.spec.js tests/ui/mask-presets-picker.spec.js tests/ui/pattern-input-chips.spec.js tests/ui/online-search-chips.spec.js tests/ui/online-scroll.spec.js tests/ui/field-format-chips.spec.js tests/ui/format-values-batch.spec.js tests/ui/command-ribbon.spec.js tests/ui/selection-edges.spec.js --output=test-results/chromium
      - id: webkit
        continue-on-error: true
        run: npx playwright test tests/ui/function-expression-chips.spec.js tests/ui/mask-builder-table.spec.js tests/ui/mask-presets-picker.spec.js tests/ui/pattern-input-chips.spec.js tests/ui/online-search-chips.spec.js tests/ui/field-format-chips.spec.js tests/ui/command-ribbon.spec.js --config=playwright.webkit.config.js --output=test-results/webkit
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: format-fields-ui-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - name: Enforce browser gates
        if: always() && (steps.chromium.outcome == 'failure' || steps.webkit.outcome == 'failure')
        run: exit 1
