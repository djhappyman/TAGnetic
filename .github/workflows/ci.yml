name: CI

on:
  push:
    branches: [next]
  pull_request:
  # Main/tag/release builds reuse these exact validation jobs before packaging.
  workflow_call:
  # Manual trigger, so CI can be re-run on the current HEAD when a hosted runner
  # fails to pick up the push-triggered job (a GitHub-side runner hiccup) without
  # needing an empty commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        id: formatting
        # Keep the behavior tests running; the final step still fails this job.
        continue-on-error: true
        run: cargo fmt --all --check

      - name: Produce formatting correction when needed
        if: steps.formatting.outcome == 'failure'
        run: |
          cargo fmt --all
          git diff --binary > /tmp/backend-format.patch

      - name: Upload formatting correction
        if: steps.formatting.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: backend-format-correction
          path: /tmp/backend-format.patch

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm ci --prefix tools/lint
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

      # The `app` crate is a Tauri 2 desktop shell; on Linux it links against
      # GTK/WebKit/glib system libraries, which the runner doesn't ship.
      # `libasound2-dev` (ALSA) is needed by the rodio audio backend used for
      # the preview player. `dbus` brings `dbus-run-session` for the media
      # session's D-Bus tests below.
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libasound2-dev \
            patchelf \
            ffmpeg \
            dbus

      - name: Install browser for UI tests
        run: npx playwright install --with-deps chromium
      - name: Artwork picker UI tests
        run: npm run test:ui

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        id: backend_build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace --no-fail-fast

      - name: Backend decoder, import and resource-pressure probes
        if: ${{ !cancelled() && steps.backend_build.outcome == 'success' }}
        run: |
          backend_probe_exit=0
          cargo test -p tagrex-player actual_decoders_acknowledge_seeks_after_converter_metadata_and_midstream_reads -- --ignored --nocapture || backend_probe_exit=1
          cargo test -p tagrex-player decoded_source_control_throughput_probe -- --ignored --nocapture || backend_probe_exit=1
          cargo test -p tagrex-commands --lib tabular:: -- --include-ignored --nocapture || backend_probe_exit=1
          cargo test -p tagrex-commands --lib shared_resource_cache_pressure_benchmark -- --ignored --nocapture || backend_probe_exit=1
          exit "$backend_probe_exit"

      - name: Independent artwork pixels and report-consumer readback
        if: ${{ !cancelled() && steps.backend_build.outcome == 'success' }}
        run: |
          backend_oracle_exit=0
          cargo test -p tagrex-core --test artwork_pipeline independent_encoded_pixels_and_original_bytes_roundtrip -- --exact --ignored --nocapture || backend_oracle_exit=1
          cargo test -p tagrex-core --test artwork_pipeline_adversarial every_exif_orientation_keeps_exact_eight_and_sixteen_bit_channel_coordinates -- --exact --ignored --nocapture || backend_oracle_exit=1
          cargo test -p tagrex-core --test artwork_exif_fresh_recheck little_endian_duplicate_orientation_pixels_match_an_independent_decoder -- --exact --ignored --nocapture || backend_oracle_exit=1
          cargo test -p tagrex-core --test report_template independent_csv_and_xml_consumers_read_utf8_and_utf16_reports -- --exact --ignored --nocapture || backend_oracle_exit=1
          cargo test -p tagrex-core --test report_template_adversarial xml_consumer_retains_cr_lf_tabs_and_unicode_across_supported_unicode_encodings -- --exact --ignored --nocapture || backend_oracle_exit=1
          cargo test -p tagrex-core --test report_template_adversarial csv_consumer_preserves_embedded_delimiters_newlines_and_control_scalars -- --exact --ignored --nocapture || backend_oracle_exit=1
          exit "$backend_oracle_exit"

      # The Linux media session (#516) exports MPRIS on the session bus; its
      # tests are ignored by default because a plain `cargo test` has no bus.
      # dbus-run-session gives this step a private one.
      - name: Test the media session on a private D-Bus
        if: ${{ !cancelled() && steps.backend_build.outcome == 'success' }}
        run: dbus-run-session -- cargo test -p tagrex mpris -- --ignored

      - name: Enforce formatting gate
        if: always() && steps.formatting.outcome == 'failure'
        run: |
          echo 'Formatting failed; see the hosted correction artifact.' >&2
          exit 1

  # A second job that only compiles, on Windows (#223). A dependency can be
  # wrong for that platform alone — a feature flag it needs, a `cfg(windows)`
  # block that stopped building — while this workflow stays green, and until
  # this job existed the first sign of it was the release workflow failing on a
  # tag, which is after the release is published. Deliberately not a bundle
  # build: the release workflow packages the installers, this only has to prove
  # the code compiles.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --no-fail-fast

  # The same on macOS (#704), for the same reason: code behind `cfg(target_os)`
  # and a dependency's platform features are otherwise first built on a release
  # tag. It is also the one job on APFS, which treats the NFC and NFD spellings
  # of a name as one file.
  macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --no-fail-fast

  advisories:
    uses: ./.github/workflows/audit.yml
    permissions:
      contents: read
