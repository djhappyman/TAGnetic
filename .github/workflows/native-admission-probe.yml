name: Native admission probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-admission-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-admission:
    name: Native admission (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [normal, single-cpu, io-pressure]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Prove Undo regression detects the original bookkeeping error
        if: matrix.profile == 'normal'
        run: |
          set -euo pipefail
          source_path=crates/core/src/plan/native_flac.rs
          evidence_dir="$(mktemp -d "${TMPDIR:-/tmp}/tagnetic-native-admission-red.XXXXXX")"
          cp "$source_path" "$evidence_dir/candidate.rs"
          cleanup() {
            cp "$evidence_dir/candidate.rs" "$source_path"
            rm -rf -- "$evidence_dir"
          }
          trap cleanup EXIT
          # Read-only baseline fetch in this disposable hosted checkout. Keep
          # today's regression and replace only the unfixed production module.
          baseline=2af025605530456b966b7fd4b44f152e8a91a609
          git fetch --no-tags --depth=1 origin "$baseline"
          git show "$baseline:$source_path" > "$source_path"
          if cargo test --locked -p tagrex-core --test native_admission_independent -- --nocapture > "$evidence_dir/result.log" 2>&1; then
            cat "$evidence_dir/result.log"
            echo "Regression unexpectedly passed against unfixed Undo bookkeeping" >&2
            exit 1
          fi
          cat "$evidence_dir/result.log"
          # A compile error or unrelated test failure is not regression proof.
          grep -F 'test result: FAILED.' "$evidence_dir/result.log"
          grep -E 'no-effect admission refusal must not require file recovery:.*Undo rollback material missing' "$evidence_dir/result.log"
          echo "Confirmed regression fails on the original no-effect rollback error"
      - name: Build focused fixture
        run: cargo test --locked -p tagrex-commands --test native_policy_admission --no-run
      - name: Deterministic FIFO and bounded stall rules
        run: cargo test --locked -p tagrex-core --lib plan::native_flac::admission::tests -- --nocapture
      - name: Repeated concurrent Apply Undo Redo
        env:
          PROBE_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          load_pid=''
          pressure_path=''
          cleanup() {
            if [[ -n "$load_pid" ]]; then
              kill "$load_pid" 2>/dev/null || true
              wait "$load_pid" 2>/dev/null || true
            fi
            if [[ -n "$pressure_path" ]]; then
              rm -f -- "$pressure_path" "${pressure_path}.ready"
            fi
          }
          trap cleanup EXIT
          ensure_pressure() {
            if [[ -n "$load_pid" ]] && ! kill -0 "$load_pid" 2>/dev/null; then
              echo "I/O pressure worker stopped before the probe completed" >&2
              wait "$load_pid" || true
              return 1
            fi
          }
          if [[ "$PROBE_PROFILE" == io-pressure ]]; then
            # Use the same temporary-filesystem location as the audio fixtures.
            pressure_path="$(mktemp "${TMPDIR:-/tmp}/tagnetic-native-admission-pressure.XXXXXX")"
            export PROBE_PRESSURE_PATH="$pressure_path"
            # Bounded competing disk traffic on this disposable hosted runner.
            python3 -u - <<'PY' &
          import os, time
          path = os.environ['PROBE_PRESSURE_PATH']
          fd = os.open(path, os.O_CREAT | os.O_TRUNC | os.O_WRONLY, 0o600)
          try:
              block = bytes(1024 * 1024)
              end = time.monotonic() + 120
              index = 0
              while time.monotonic() < end:
                  os.pwrite(fd, block, (index % 64) * len(block))
                  os.fsync(fd)
                  index += 1
                  if index == 1:
                      with open(path + '.ready', 'w') as ready:
                          ready.write('ready')
          finally:
              os.close(fd)
          PY
            load_pid=$!
            for ready_attempt in $(seq 1 100); do
              ensure_pressure
              if [[ -s "${pressure_path}.ready" ]]; then break; fi
              sleep 0.05
            done
            if [[ ! -s "${pressure_path}.ready" ]]; then
              echo "I/O pressure worker did not confirm its first successful fsync" >&2
              exit 1
            fi
          fi
          runner=(cargo test --locked -p tagrex-commands --test native_policy_admission)
          if [[ "$PROBE_PROFILE" == single-cpu ]]; then
            core="$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')"
            runner=(taskset -c "$core" "${runner[@]}")
          fi
          for attempt in $(seq 1 25); do
            ensure_pressure
            echo "Native admission $PROBE_PROFILE attempt ${attempt}/25"
            "${runner[@]}" -- --nocapture
            ensure_pressure
          done
      - name: Independent bounded pressure and callback probes
        if: ${{ !cancelled() }}
        run: cargo test --locked -p tagrex-core --test native_admission_independent -- --nocapture
